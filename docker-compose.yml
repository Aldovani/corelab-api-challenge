version: '3.8'

services:

  app:
    build: .
    ports:
      - 8080:8080
    volumes:
      - .:/usr/src/app
    environment:
      PORT: 8080
      DATABASE_URL: "postgresql://admin:admin@localhost:5432/core-notes?schema=public"

    depends_on:
    - database

    command: sh -c "npx prisma migrate deploy && node index.js"


  database:
    image: bitnami/postgresql:latest
    ports:
    - 5432:5432
    volumes:
      - .:/usr/src/database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: core-notes



