
services:
  app:
    build:
      context: .
    ports:
      - 8888:8888
    volumes:
      - .:/usr/src/app
    environment:
      PORT: 8888
      DATABASE_URL: "postgresql://admin:admin@database:5432/core-notes?schema=public"
    networks:
      - core-notes

    depends_on:
      - database


  database:
    image: bitnami/postgresql:latest
    ports:
      - 5432:5432
    volumes:
      - .:/usr/src/database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: core-notes

    networks:
      - core-notes

networks:
  core-notes:
    driver: bridge

