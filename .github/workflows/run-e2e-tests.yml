name: Run E2E tests

on: [push]

jobs:
  run-e2e-test:
    name: Run E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: bitnami/postgresql
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: core-notes

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - run: npm ci

    - run: npm run test:e2e
